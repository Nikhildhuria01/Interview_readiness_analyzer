version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend

    container_name: interview-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend

    container_name: interview-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped